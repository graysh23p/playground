<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123d31"><title>二十四点 v2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#123d31;color:#fff;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}body{height:100vh;height:100dvh}main{height:100%;display:flex;flex-direction:column;gap:12px;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));max-width:1600px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}h1{font-size:22px;margin:0}header span{font-size:14px;color:#bcd3c6}.cards{flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:12px}.card{position:relative;display:flex;align-items:center;justify-content:center;background:#fffdf5;color:#21382e;border-radius:14px;box-shadow:0 4px 0 #0003;container-type:size}.card.red{color:#bf393b}.face{font-family:Georgia,serif;font-weight:bold;font-size:clamp(42px,24vw,150px);font-size:clamp(42px,min(58cqw,56cqh),230px);line-height:1}.corner{position:absolute;left:12px;top:10px;font-size:clamp(18px,5vw,28px);font-weight:650;line-height:1.05;text-align:center}.corner small{display:block;font-size:.9em}.corner.bottom{left:auto;top:auto;right:12px;bottom:10px;transform:rotate(180deg)}.actions{display:flex;gap:10px;flex:none}button{flex:1;min-height:48px;padding:12px 8px;border:1px solid #ffffff40;border-radius:10px;font:600 16px system-ui,-apple-system,sans-serif;color:#fff;background:#ffffff12;touch-action:manipulation}button:first-child{background:#f1ca7b;color:#21382e;border:0}button:active{opacity:.8}button:focus-visible{outline:3px solid #fff;outline-offset:2px}.answer{flex:none;margin:0;text-align:center;font-size:clamp(18px,4.5vw,26px);padding:8px 6px;background:#09291f;border-radius:10px;color:#f1ca7b;overflow-wrap:anywhere}.warning{font-size:16px;line-height:1.6;color:#f1ca7b} [hidden]{display:none!important}
@media(orientation:landscape){main{gap:10px}.cards{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:10px}.corner{font-size:20px;left:9px;top:8px}.corner.bottom{right:9px;bottom:8px}.face{font-size:clamp(42px,14vw,180px);font-size:clamp(42px,min(58cqw,56cqh),200px)}h1{font-size:18px}button{min-height:44px;padding:9px}.answer{padding:4px;font-size:20px}}
@media(max-height:340px){header > span{display:none}main{gap:6px}.corner{font-size:16px}.cards{gap:6px}button{min-height:40px;padding:7px}.answer{font-size:18px}}

.round{display:inline-block;margin-left:8px;padding:5px 9px;border-radius:7px;background:#ffffff15;color:#f1ca7b;font-size:14px;vertical-align:middle;white-space:nowrap}.answer{padding:12px;text-align:left;max-height:40%;overflow:auto}.answer-title{font-size:14px;color:#bcd3c6;margin-bottom:8px}#steps{display:grid;gap:6px;list-style:none;padding:0;margin:0;counter-reset:step}#steps li{display:flex;align-items:center;gap:10px;font-size:20px;line-height:1.45;font-variant-numeric:tabular-nums}#steps li:before{counter-increment:step;content:counter(step);display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#ffffff15;color:#bcd3c6;font-size:14px;flex:none}.formula{margin-top:10px;padding-top:8px;border-top:1px solid #ffffff20;font-size:16px;line-height:1.6;color:#d9e7df;overflow-wrap:anywhere}.result{color:#f1ca7b;font-weight:750}.fraction{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.2;margin:0 3px}.fraction span:first-child{border-bottom:1px solid currentColor;padding:0 3px 2px}.fraction span:last-child{padding-top:2px}@media(orientation:landscape){.answer{max-height:38%;padding:8px 12px}#steps{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}#steps li{font-size:18px;gap:6px}.formula{margin-top:5px;padding-top:4px;font-size:14px}.answer-title{margin-bottom:5px}}@media(max-width:360px){header > span{display:none}}
</style></head><body><main><header><h1>二十四点 <b class="round" id="round">第 1 场</b></h1><span>A = 1 · 每张牌用一次</span></header><div class="warning" id="warning">如果没有出现四张牌，请通过 Safari 打开网页链接。手机文件预览可能无法运行游戏。</div><section class="cards" id="cards" aria-label="本题四张牌"></section><section class="answer" id="answer" hidden aria-label="参考解法" aria-live="polite"><div class="answer-title">参考解法 · 按顺序计算</div><ol id="steps"></ol><div class="formula" id="formula"></div></section><div class="actions"><button id="deal" type="button">换一题</button><button id="toggle" type="button" aria-expanded="false" aria-controls="answer">显示参考解法</button></div></main><script>
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t;}return a||1;}
function fraction(n,d=1){if(d<0){n=-n;d=-d;}const g=gcd(n,d);return {n:n/g,d:d/g};}
function show(f){return f.d===1?String(f.n):`<span class="fraction"><span>${f.n}</span><span>${f.d}</span></span>`;}
function combine(a,b,op){let f;if(op==='+')f=fraction(a.f.n*b.f.d+b.f.n*a.f.d,a.f.d*b.f.d);if(op==='−')f=fraction(a.f.n*b.f.d-b.f.n*a.f.d,a.f.d*b.f.d);if(op==='×')f=fraction(a.f.n*b.f.n,a.f.d*b.f.d);if(op==='÷'){if(b.f.n===0)return null;f=fraction(a.f.n*b.f.d,a.f.d*b.f.n);}return {f,e:`(${a.e} ${op} ${b.e})`,steps:[...a.steps,...b.steps,`${show(a.f)} ${op} ${show(b.f)} = <strong class="result">${show(f)}</strong>`]};}
function solve(items){if(items.length===1)return items[0].f.n===24*items[0].f.d?items[0]:null;for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const a=items[i],b=items[j],rest=items.filter((_,k)=>k!==i&&k!==j);for(const [left,right,op] of [[a,b,'+'],[a,b,'−'],[b,a,'−'],[a,b,'×'],[a,b,'÷'],[b,a,'÷']]){const c=combine(left,right,op);if(c){const result=solve([...rest,c]);if(result)return result;}}}return null;}

const cards=document.getElementById('cards'),answer=document.getElementById('answer'),toggle=document.getElementById('toggle');
let solution=null,round=0;
function hideAnswer(){answer.hidden=true;toggle.textContent='显示参考解法';toggle.setAttribute('aria-expanded','false');}
function deal(){const deck=Array.from({length:40},(_,i)=>({n:i%10+1,s:Math.floor(i/10)}));let hand;do{const pool=deck.slice();hand=Array.from({length:4},()=>pool.splice(Math.floor(Math.random()*pool.length),1)[0]);solution=solve(hand.map(c=>({f:fraction(c.n),e:String(c.n),steps:[]})));}while(!solution);cards.innerHTML='';hand.forEach(c=>{const card=document.createElement('div'),face=c.n===1?'A':c.n,suit=['♠','♥','♣','♦'][c.s];card.className='card'+(c.s%2?' red':'');card.setAttribute('aria-label',['黑桃','红桃','梅花','方块'][c.s]+face);card.innerHTML=`<span class="corner">${face}<small>${suit}</small></span><span class="face">${face}</span><span class="corner bottom">${face}<small>${suit}</small></span>`;cards.appendChild(card);});round++;document.getElementById('round').textContent='第 '+round+' 场';document.getElementById('steps').innerHTML=solution.steps.map(step=>'<li><span>'+step+'</span></li>').join('');document.getElementById('formula').textContent=solution.e.slice(1,-1)+' = 24';hideAnswer();document.getElementById('warning').hidden=true;}
toggle.onclick=()=>{if(answer.hidden){answer.hidden=false;toggle.textContent='隐藏参考解法';toggle.setAttribute('aria-expanded','true');}else hideAnswer();};document.getElementById('deal').onclick=deal;deal();
</script></body></html>
