<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>二十四点 · 四张牌，一点灵感</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#f3f7f4;background:#102e28;font-size:16px}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 35%,#245347 0,#102e28 75%)}button,input{font:inherit}button{cursor:pointer;transition:transform .15s,background .15s}button:active{transform:translateY(2px)}button:focus-visible,input:focus-visible{outline:3px solid #efc879;outline-offset:4px}button:disabled{opacity:.45;cursor:default}main{max-width:880px;margin:auto;padding:38px 24px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff24;padding-bottom:22px}.brand{font-size:21px;font-weight:750}.brand span{color:#efc879}.edition{font-size:14px;color:#b3c7bf}.intro{text-align:center;margin:42px 0 28px}.eyebrow{color:#efc879;font-size:14px;letter-spacing:3px}h1{font-size:clamp(30px,5vw,48px);letter-spacing:2px;margin:12px 0}p{color:#bbd0c7;line-height:1.8;margin:8px 0}.table{padding:30px;border:1px solid #ffffff28;border-radius:24px;background:#ffffff05;box-shadow:0 24px 65px #0002}.stats{display:flex;justify-content:space-between;color:#b9cec5;font-size:14px}.stats strong{font-variant-numeric:tabular-nums;color:#efc879;margin-left:8px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:30px 0}.card{border:0;border-radius:12px;height:190px;background:#fcfaf4;color:#233a32;box-shadow:0 8px 0 #0002;position:relative}.card.red{color:#be4c45}.corner{position:absolute;top:12px;left:14px;font-weight:700;font-size:22px;line-height:1.1}.corner.bottom{top:auto;left:auto;bottom:12px;right:14px;transform:rotate(180deg)}.value{font-family:Georgia,serif;font-size:64px}.suit{display:block;font-size:24px}.card.used{opacity:.45;transform:translateY(5px)}label{display:block;font-size:14px;color:#bbd0c7;margin-bottom:10px}.input-wrap{display:flex;align-items:center;gap:12px;background:#09221e;border:1px solid #ffffff2b;border-radius:12px;padding:8px 16px}input{width:100%;min-width:0;background:transparent;border:0;color:#fff;font-size:25px;padding:10px 0;outline:none;font-variant-numeric:tabular-nums}.equals{color:#efc879;font-size:26px;white-space:nowrap}.keys{display:flex;gap:9px;margin:16px 0;flex-wrap:wrap}.key{border:1px solid #ffffff30;background:#ffffff0b;color:#fff;border-radius:8px;min-width:48px;height:45px;font-size:22px}.key:hover{background:#ffffff20}.key.text{font-size:14px;padding:0 15px}.actions{display:flex;gap:12px;margin-top:24px}.primary,.secondary{padding:14px 20px;border-radius:10px;border:0;font-weight:650}.primary{background:#efc879;color:#233a32;flex:1}.primary:hover{background:#ffdb95}.secondary{background:#ffffff10;border:1px solid #ffffff30;color:#fff}.hint{background:none;color:#b9cec5;border:0;margin:18px auto 0;display:block;text-decoration:underline;text-underline-offset:5px;font-size:14px}.message{min-height:30px;margin-top:14px;text-align:center;line-height:1.7;color:#efc879;overflow-wrap:anywhere}.rules{display:flex;justify-content:center;gap:25px;flex-wrap:wrap;margin:25px 0;color:#b3c7bf;font-size:14px}.rules span::before{content:'·';color:#efc879;margin-right:8px}footer{text-align:center;color:#8fa99d;font-size:14px;margin:28px 0}@media(max-width:600px){main{padding:22px 16px}.edition{font-size:12px}.intro{margin:30px 0 22px}.table{padding:20px 14px}.cards{gap:9px;margin:24px 0}.card{height:140px}.value{font-size:44px}.corner{font-size:16px;left:9px;top:9px}.corner.bottom{right:9px;bottom:9px}.suit{font-size:17px}.keys{gap:7px}.key{min-width:40px}.rules{gap:10px}.primary,.secondary{padding:13px 15px}input{font-size:20px}}
</style></head>
<body><main>
<header><div class="brand"><span>24</span> / 二十四点</div><div class="edition">A–10 · 四则运算</div></header>
<section class="intro"><div class="eyebrow">LET’S PLAY</div><h1>四张牌，算出 24。</h1><p>用一点巧思，把眼前的数字连起来。</p></section>
<section class="table" aria-label="二十四点游戏">
<div class="stats"><span>第 <strong id="round">1</strong> 题</span><span>已解出 <strong id="score">0</strong></span><span>用时 <strong id="timer">00:00</strong></span></div>
<div id="startup-warning" role="alert" style="margin:24px 0;padding:16px;border:1px solid #efc879;border-radius:10px;color:#efc879;line-height:1.8">如果这里没有出现四张牌，说明游戏脚本没有运行。微信、QQ 或手机文件预览可能不支持此游戏，请下载文件后尝试用完整浏览器打开；若仍无牌，需要通过网页链接访问。</div><div class="cards" id="cards"></div>
<form id="answer-form"><label for="expression">你的算式 · 点击牌面或直接输入数字</label><div class="input-wrap"><input id="expression" autocomplete="off" spellcheck="false" placeholder="例如：(1 + 3) × (2 + 4)" aria-describedby="message"><span class="equals">= 24</span></div>
<div class="keys" id="keys"><button class="key" type="button" data-token="+">+</button><button class="key" type="button" data-token="−">−</button><button class="key" type="button" data-token="×">×</button><button class="key" type="button" data-token="÷">÷</button><button class="key" type="button" data-token="(">(</button><button class="key" type="button" data-token=")">)</button><button class="key text" type="button" id="undo">退格</button><button class="key text" type="button" id="clear">清空</button></div>
<div class="actions"><button class="primary" type="submit">检查答案</button><button class="secondary" type="button" id="deal">换一组牌</button></div></form>
<div class="message" id="message" role="status" aria-live="polite"></div><button class="hint" id="hint" type="button">看看参考解法</button>
</section><div class="rules"><span>每张牌用且只用一次</span><span>可使用 + − × ÷ 和括号</span><span>A = 1，每题都有解</span></div><footer>慢慢想，好答案值得等待。</footer>
</main><script>
function solve(items){
 if(items.length===1)return Math.abs(items[0].v-24)<1e-8?items[0].e:null;
 for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){
  const a=items[i],b=items[j],rest=items.filter((_,k)=>k!==i&&k!==j);
  const ops=[[a.v+b.v,`(${a.e}+${b.e})`],[a.v-b.v,`(${a.e}−${b.e})`],[b.v-a.v,`(${b.e}−${a.e})`],[a.v*b.v,`(${a.e}×${b.e})`]];
  if(Math.abs(b.v)>1e-10)ops.push([a.v/b.v,`(${a.e}÷${b.e})`]);
  if(Math.abs(a.v)>1e-10)ops.push([b.v/a.v,`(${b.e}÷${a.e})`]);
  for(const [v,e] of ops){const result=solve([...rest,{v,e}]);if(result)return result;}
 }return null;
}
function evaluate(source,numbers){
 const s=source.replace(/\s/g,'').replace(/[×xX]/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/（/g,'(').replace(/）/g,')');
 if(!s||/[^0-9+*/()\-]/.test(s))throw Error('请只使用牌面数字、加减乘除和括号。');
 const tokens=s.match(/\d+|[+*/()\-]/g);let pos=0;const used=[];
 function atom(){const t=tokens[pos++];if(t==='('){const v=expression();if(tokens[pos++]!==')')throw Error('请检查括号是否配对。');return v;}if(t&&/^\d+$/.test(t)){if(t.length>1&&t[0]==='0')throw Error('请直接使用牌面数字。');used.push(Number(t));return Number(t);}throw Error('算式还不完整，请检查数字和运算符。');}
 function term(){let v=atom();while(tokens[pos]==='*'||tokens[pos]==='/'){const op=tokens[pos++],b=atom();if(op==='/'&&Math.abs(b)<1e-12)throw Error('不能除以零，请换一种算法。');v=op==='*'?v*b:v/b;}return v;}
 function expression(){let v=term();while(tokens[pos]==='+'||tokens[pos]==='-'){const op=tokens[pos++],b=term();v=op==='+'?v+b:v-b;}return v;}
 const value=expression();if(pos!==tokens.length)throw Error('数字之间需要运算符，请检查算式。');
 if(used.sort((a,b)=>a-b).join(',')!==[...numbers].sort((a,b)=>a-b).join(','))throw Error('四张牌必须各用一次，不能添加其他数字。');return value;
}
const $=id=>document.getElementById(id);let hand=[],solution='',round=0,score=0,start=Date.now(),finished=false;
function renderUsed(){const counts={};($('expression').value.match(/\d+/g)||[]).forEach(n=>counts[Number(n)]=(counts[Number(n)]||0)+1);[...$('cards').children].forEach((card,i)=>{const n=hand[i].n,used=counts[n]>0;if(used)counts[n]--;card.classList.toggle('used',used);card.disabled=used;});}
function append(token){const input=$('expression'),a=input.selectionStart,b=input.selectionEnd;input.value=input.value.slice(0,a)+token+input.value.slice(b);input.focus();input.setSelectionRange(a+token.length,a+token.length);renderUsed();}
function deal(){const deck=Array.from({length:40},(_,i)=>({n:i%10+1,s:Math.floor(i/10)}));do{const pool=[...deck];hand=Array.from({length:4},()=>pool.splice(Math.floor(Math.random()*pool.length),1)[0]);solution=solve(hand.map(c=>({v:c.n,e:String(c.n)})));}while(!solution);round++;finished=false;start=Date.now();$('timer').textContent='00:00';$('round').textContent=round;$('expression').value='';$('message').textContent='';$('cards').replaceChildren();hand.forEach(c=>{const button=document.createElement('button'),suit=['♠','♥','♣','♦'][c.s],face=c.n===1?'A':c.n;button.type='button';button.className='card'+(c.s%2?' red':'');button.setAttribute('aria-label',`${['黑桃','红桃','梅花','方块'][c.s]}${face}，输入 ${c.n}`);button.innerHTML=`<span class="corner">${face}<span class="suit">${suit}</span></span><span class="value">${face}</span><span class="corner bottom">${face}<span class="suit">${suit}</span></span>`;button.onclick=()=>append(String(c.n));$('cards').append(button);});}
$('keys').onclick=e=>{if(e.target.dataset.token)append(e.target.dataset.token);};
$('undo').onclick=()=>{const input=$('expression'),a=input.selectionStart,b=input.selectionEnd;input.value=input.value.slice(0,a===b?Math.max(0,a-1):a)+input.value.slice(b);input.focus();input.setSelectionRange(Math.max(0,a-(a===b?1:0)),Math.max(0,a-(a===b?1:0)));renderUsed();};
$('clear').onclick=()=>{$('expression').value='';$('expression').focus();renderUsed();$('message').textContent='';};$('expression').oninput=renderUsed;$('deal').onclick=deal;
$('answer-form').onsubmit=e=>{e.preventDefault();try{const v=evaluate($('expression').value,hand.map(c=>c.n));if(Math.abs(v-24)<1e-8){if(!finished){score++;$('score').textContent=score;finished=true;}$('message').textContent='答对了！这四张牌，刚好凑成 24。';}else $('message').textContent=`这道算式的结果是 ${Number(v.toFixed(6))}，再试试吧。`;}catch(err){$('message').textContent=err.message;}};
$('hint').onclick=()=>{finished=true;$('message').textContent=`参考解法：${solution} = 24`;};
setInterval(()=>{if(!finished){const sec=Math.floor((Date.now()-start)/1000);$('timer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');}},1000);deal();$('startup-warning').hidden=true;
</script></body></html>
